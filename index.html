<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mari Hasrat-e-Dil 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at center, #1a0a0f 0%, #000 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Poppins',sans-serif}
#hearts{position:fixed;inset:0;pointer-events:none;z-index:1}
.heart{position:absolute;bottom:-30px;animation:floatUp linear forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(0.8);opacity:0}10%{opacity:1}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}
.book-wrap{position:relative;z-index:2;width:92%;max-width:390px;perspective:1200px}
.book{background:linear-gradient(180deg,#fff8f9 0%,#ffe4e8 100%);border-radius:20px;padding:32px 26px;box-shadow:0 25px 80px rgba(194,24,91,0.35);min-height:600px;display:flex;flex-direction:column;justify-content:center;text-align:center;transition:transform 0.6s}
.page{animation:pageIn 0.7s cubic-bezier(0.23,1,0.32,1)}
@keyframes pageIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.subtitle{font-size:9px;letter-spacing:4px;color:#d48a9e;font-weight:600;margin-bottom:14px;text-transform:uppercase}
h1{font-family:'Great Vibes',cursive;font-size:44px;color:#b0124a;line-height:0.95;margin-bottom:16px}
.line{font-size:13px;color:#4a2a32;line-height:1.85;margin-bottom:10px}
.btn{margin-top:26px;background:linear-gradient(135deg,#c2185b,#880e4f 100%);color:#fff;border:none;padding:13px 24px;border-radius:50px;font-size:13.5px;cursor:pointer;box-shadow:0 8px 20px rgba(194,24,91,0.35);width:100%}
.progress{height:3px;background:#f8e2e7;border-radius:10px;margin-top:18px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#c2185b,#ff5f8a);transition:width 0.6s}
.dots{font-size:10px;color:#c79aa6;margin-top:8px;display:flex;justify-content:space-between}
.big-heart{font-size:52px;margin:12px 0;animation:beat 1.3s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.footer{position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(90deg,#880e4f,#c2185b);color:#fff;text-align:center;padding:8px;font-size:11px;z-index:3}
</style>
</head>
<body>
<div id="hearts"></div>
<div class="book-wrap"><div class="book" id="book"></div></div>
<div class="footer">❤️ 04 Oct 2026 - 07:00 PM to 09:00 PM ❤️ ap Meri Aadat Ban Gayi Ho</div>
<script>
const pages = [
  { subtitle: "Main Title", title: "Mari Hasrat-e-Dil", lines: ["ap meri woh khwahish ho,<br>Jo mere dil mn hamesha rahy gee ❤️","Ye kitaab sirf apka liye hai..."], bigHeart:true, btn: "Kitaab Kholo 📖" },
  { subtitle: "Yaad Hai Aapko?", title: "Pehli Mulaqaat", lines: ["Kya yaad hai aapko<br>hum kab mile the first time?","<b>Sunday, 04 Oct 2026<br>07:00 PM to 09:00 PM</b>","Wo do ghante meri zindagi ke sab se haseen ghante the."], btn: "Aage Suno 📖" },
  { subtitle: "Wo Din Kabhi Nahi Sakta", title: "Mera Dil", lines: ["Mujhe wo din to kabhi nahi bhool sakta,<br>jab first time mere paas ayen thi","Uske baad puri raat mn dua krta rha kash ye larki dubara ik bar meri shop me aa jaye","Usne bataya ke:<br><b>'aur bat hoty hoty jab ap na btaya commited ho mara dil sa gya gasa har cheez pheki si lg rahi ho'</b>","aur jab chala ka wo mazak tha Uske baad mere dil ko hausla hua"], btn: "Phir Kya Hua ❤️" },
  { subtitle: "Aapka Challenge", title: "Aapka Address", lines: ["Phir aapne mujhe<br>aapka address dhondne ka challenge diya,","Jo ke bohat mushkil hai,<br>par main koshish kar raha hun","Aap bhi koi moka nahi jane deti","Is bache ko tang karne ka","Har jagah dhondna,<br>par milna itna asan nahi"], btn: "Aage Chalo 💌" },
  { subtitle: "Day 5 - Intezaar", title: "Kal Se Aage", lines: ["Intezaar ka safar abhi jaari hai...","Bas aap apna khyal rhaka kryn mara kuchu puchu bhott si duwaon ka sath ijzatt"], btn: "Shuru Se Dekho 📖" }
];
let cur=0;
function render(){
  const p=pages[cur];
  document.getElementById('book').innerHTML=`<div class="page"><div class="subtitle">${p.subtitle} • ${cur+1} / ${pages.length}</div><h1>${p.title}</h1>${p.bigHeart?'<div class="big-heart">❤️</div>':''}${p.lines.map(t=>`<p class="line">${t}</p>`).join('')}<button class="btn" onclick="${cur==pages.length-1?'goHome()':'next()'}">${p.btn}</button><div class="progress"><div class="progress-bar" style="width:${(cur+1)/pages.length*100}%"></div></div><div class="dots"><span>04 Oct</span><span>Mari Hasrat-e-Dil</span></div></div>`;
}
function next(){ cur++; render(); const b=document.querySelector('.book'); b.style.transform='rotateY(-8deg) scale(0.98)'; setTimeout(()=>{b.style.transform='rotateY(0) scale(1)';},300); }
function goHome(){ cur=0; render(); }
function createHeart(){ const h=document.createElement('div'); h.className='heart'; h.textContent=['❤️','💕','💖','💗'][Math.floor(Math.random()*3)]; h.style.left=Math.random()*100+'vw'; h.style.fontSize=(12+Math.random()*12)+'px'; h.style.animationDuration=(3+Math.random()*3)+'s'; document.getElementById('hearts').appendChild(h); setTimeout(()=>h.remove(),5000); }
setInterval(createHeart,220); render();
</script>
</body>
</html>
